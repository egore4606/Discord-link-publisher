[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "discord-link-publisher"
version = "2.0.0"
description = "Publish a list of links or messages to Discord through a webhook"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "egore4606" }]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = ["requests>=2.32.4,<3"]

[project.optional-dependencies]
dev = [
  "build>=1.2.2,<2",
  "pytest>=8.4.1,<10",
  "ruff>=0.12.3,<1",
]

[project.scripts]
discord-link-publisher = "main:cli"

[project.urls]
Homepage = "https://github.com/egore4606/Discord-link-publisher"
Issues = "https://github.com/egore4606/Discord-link-publisher/issues"

[tool.setuptools]
py-modules = ["main"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
